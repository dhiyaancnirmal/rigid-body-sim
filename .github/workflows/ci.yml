name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Machine info
        run: lscpu | grep -E "Model name|Flags" | cut -c1-200; c++ --version | head -1
      - name: Install Python dependencies
        run: python -m pip install pybind11==3.1.0 numpy pytest hypothesis pillow
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -Dpybind11_DIR="$(python -m pybind11 --cmakedir)" -DPython_EXECUTABLE="$(which python)"
      - name: Build
        run: cmake --build build -j2
      - name: C++ tests
        run: ./build/rbsim_tests
      - name: Python tests
        run: python -m pytest -q tests/python
      - name: README numbers match results files
        run: python scripts/make_tables.py --check
